name: "CI Checks"

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop
      - bugfix/*

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api

      - name: Build backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --configuration Release --no-restore


  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build
        
  test:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
  
      - name: Run unit tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.unit-tests --configuration Release
  
      - name: Install Playwright CLI
        run: dotnet tool install --global Microsoft.Playwright.CLI
  
      - name: Install Playwright browsers
        run: playwright install --with-deps
  
      - name: Run UI tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release
