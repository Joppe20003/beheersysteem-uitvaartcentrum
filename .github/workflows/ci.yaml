name: "CI Checks"

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api

      - name: Build backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --configuration Release --no-restore


  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build


  ui-tests:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci

      - name: Build UI tests
        run: dotnet build beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release

      - name: Start backend API
        run: |
          nohup dotnet run --project beheersysteem-uitvaartcentrum.backend.api > backend.log 2>&1 &
          echo "Backend started"

      - name: Start frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: |
          nohup npm run dev -- --host --port 5173 > frontend.log 2>&1 &
          echo "Frontend started"

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          npx wait-on http://localhost:5000 --timeout 50000

          echo "Waiting for frontend..."
          npx wait-on https://localhost:5173 --timeout 50000

      - name: Install Playwright browsers
        working-directory: ./beheersysteem-uitvaartcentrum.backend.ui-tests
        run: npx playwright install

      - name: Run UI tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release
