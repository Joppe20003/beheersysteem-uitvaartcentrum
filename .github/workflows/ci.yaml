name: "CI Checks"
on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop
      - bugfix/*

jobs:
  backend-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api
      - name: Build Backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release
      - name: Unit Tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.unit-tests/beheersysteem-uitvaartcentrum.backend.unit-tests.csproj --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci
      - name: Build Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build

  playwright-tests:
    runs-on: ubuntu-latest
    needs: [backend-and-unit-tests, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uitvaartcentrum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Start Backend
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=uitvaartcentrum_test;Username=postgres;Password=postgres"
        run: |
          dotnet restore beheersysteem-uitvaartcentrum.backend.api
          dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release
          dotnet run --project beheersysteem-uitvaartcentrum.backend.api --configuration Release &
          sleep 15

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install & Start Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: |
          npm ci
          npm run build
          npm run preview &
          sleep 5

      - name: Restore UI test dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.ui-tests

      - name: Build UI tests
        run: dotnet build beheersysteem-uitvaartcentrum.backend.ui-tests --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh beheersysteem-uitvaartcentrum.backend.ui-tests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run Playwright tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=uitvaartcentrum_test;Username=postgres;Password=postgres"
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./beheersysteem-uitvaartcentrum.backend.ui-tests/playwright-report/
          retention-days: 30
