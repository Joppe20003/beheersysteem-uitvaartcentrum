name: "CI Checks"

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop
      - bugfix/*

jobs:
  backend-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api

      - name: Build Backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.unit-tests/beheersysteem-uitvaartcentrum.backend.unit-tests.csproj --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build

  playwright-tests:
    runs-on: ubuntu-latest
    needs: [backend-and-unit-tests, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres # Standaard database voor de container zelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Backend
        run: |
          dotnet restore beheersysteem-uitvaartcentrum.backend.api
          dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && echo "Postgres ready" && break
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Start Backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5277
          # GEFIXT: Twee aparte databases opgesplitst om te voorkomen dat migraties en seeders elkaar overschrijven
          ConnectionStrings__AppConnection: "Host=localhost;Port=5432;Database=uitvaart_app_test;Username=postgres;Password=postgres;Include Error Detail=true"
          ConnectionStrings__AuthConnection: "Host=localhost;Port=5432;Database=uitvaart_auth_test;Username=postgres;Password=postgres;Include Error Detail=true"
          FileStorage__BasePath: /tmp/uploads
          Cors__AllowedOrigins: https://localhost:5173
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
          Jwt__ExpiresInMinutes: "60"
        run: |
          dotnet run --project beheersysteem-uitvaartcentrum.backend.api \
            --configuration Release \
            --no-launch-profile &
          echo "Wachten op backend..."
          for i in $(seq 1 30); do
            curl -s http://localhost:5277/auth/status > /dev/null 2>&1 && echo "Backend is klaar" && break
            echo "Poging $i..."
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Start Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          VITE_API_URL: http://localhost:5277/
        run: |
          npm ci
          npm run dev &
          echo "Wachten op frontend..."
          for i in $(seq 1 30); do
            curl -sk https://localhost:5173 > /dev/null 2>&1 && echo "Frontend is klaar" && break
            echo "Poging $i..."
            sleep 2
          done

      - name: Restore UI test dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.ui-tests

      - name: Build UI tests
        run: dotnet build beheersysteem-uitvaartcentrum.backend.ui-tests --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh beheersysteem-uitvaartcentrum.backend.ui-tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release
