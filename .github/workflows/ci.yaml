name: "CI Checks"

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop
      - bugfix/*

jobs:
  backend-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api

      - name: Build Backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore

      - name: Unit Tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.unit-tests/beheersysteem-uitvaartcentrum.backend.unit-tests.csproj

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build

  playwright-tests:
    runs-on: ubuntu-latest
    needs: [backend-and-unit-tests, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build Backend
        run: |
          dotnet restore beheersysteem-uitvaartcentrum.backend.api
          dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore

      - name: Wait for Postgres to be fully stable
        run: sleep 5

      - name: Start Backend
        env:
          ConnectionStrings__AppConnection: "Host=localhost;Port=5432;Database=uitvaartcentrum;Username=postgres;Password=postgres;Include Error Detail=true"
          ConnectionStrings__AuthConnection: "Host=localhost;Port=5432;Database=auth;Username=postgres;Password=postgres;Include Error Detail=true"
          FileStorage__BasePath: /tmp/uploads
          Cors__AllowedOrigins: "https://localhost:5173"
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
          Jwt__ExpiresInMinutes: "60"
        run: |
          dotnet run --project beheersysteem-uitvaartcentrum.backend.api --no-launch-profile &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Start Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: |
          npm ci
          npm run dev &
          echo "Wachten op frontend..."
          for i in $(seq 1 30); do
            curl -sk https://localhost:5173 > /dev/null 2>&1 && echo "Frontend is klaar" && break
            echo "Poging $i..."
            sleep 2
          done

      - name: Restore UI test dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.ui-tests

      - name: Build UI tests
        run: dotnet build beheersysteem-uitvaartcentrum.backend.ui-tests --no-restore

      - name: Install Playwright browsers
        run: pwsh beheersysteem-uitvaartcentrum.backend.ui-tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests
