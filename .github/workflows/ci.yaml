name: "CI Checks"
on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - hotfix/*
      - release/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - develop
      - bugfix/*

jobs:
  backend-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore beheersysteem-uitvaartcentrum.backend.api
      - name: Build Backend
        run: dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release
      - name: Unit Tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.unit-tests/beheersysteem-uitvaartcentrum.backend.unit-tests.csproj --configuration Release

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci
      - name: Build Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm run build

  playwright-tests:
    runs-on: ubuntu-latest
    needs: [backend-and-unit-tests, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start Backend
        run: |
          dotnet build beheersysteem-uitvaartcentrum.backend.api --no-restore --configuration Release
          dotnet run --project beheersysteem-uitvaartcentrum.backend.api --configuration Release &
          echo "Waiting for backend to start..."
          sleep 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install frontend dependencies
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: npm ci
      - name: Start Frontend
        working-directory: ./beheersysteem-uitvaartcentrum.frontend
        run: |
          npm run dev
          echo "Waiting for frontend to start..."
          sleep 5

      - name: Restore Playwright test dependencies
        run: dotnet restore dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests

      - name: Build Playwright tests
        run: dotnet build beheersysteem-uitvaartcentrum.backend.ui-tests --no-restore --configuration Release

      - name: Install Playwright browsers
        run: |
          cd beheersysteem-uitvaartcentrum.backend.ui-tests
          pwsh bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run Playwright tests
        run: dotnet test beheersysteem-uitvaartcentrum.backend.ui-tests --configuration Release
